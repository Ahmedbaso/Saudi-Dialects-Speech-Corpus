name: Update dataset statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-dataset-statistics
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check 180-minute update interval
        id: check_interval
        env:
          UPDATE_INTERVAL_MINUTES: "180"
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/should_update.py

      - name: Set up Python
        if: steps.check_interval.outputs.should_update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Python dependencies
        if: steps.check_interval.outputs.should_update == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fill missing recording durations
        if: steps.check_interval.outputs.should_update == 'true'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: Recordings
          ATTACHMENT_FIELD: Attachments
          DURATION_FIELD: Duration Seconds
        run: python scripts/fill_durations.py

      - name: Generate stats JSON
        if: steps.check_interval.outputs.should_update == 'true'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: python scripts/generate_stats.py

      - name: Commit updated stats
        if: steps.check_interval.outputs.should_update == 'true'
        run: |
          if [[ -n $(git status --porcelain assets/stats.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/stats.json
            git commit -m "Update dataset statistics"
            git pull --rebase origin main
            git push
          else
            echo "No stats changes to commit."
          fi
